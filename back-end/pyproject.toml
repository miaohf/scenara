[project]
name = "scenara-backend"
version = "0.1.0"
description = "Scenara FastAPI backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.17",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "Pillow>=11.0.0",
]
