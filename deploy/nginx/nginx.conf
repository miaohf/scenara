# Scenara nginx 入口（docker compose 挂载，无需 sed）
#
# 媒体：/api/v1/media/raw/*  → 本地磁盘 sendfile + Range（不经 Next / FastAPI）
# API ：/api/*               → FastAPI（去掉 /api 前缀，与 Next rewrite 一致）
# 页面：其余                 → Next.js
#
# 访问控制：文件名是 UUID，关闭目录列表。HMAC 仍由 FastAPI /v1/media/raw 校验
# （直连 :8000 时生效）。此处不做 auth_request，避免每张缩略图多一跳 API。

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/scenara-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream scenara_frontend {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    upstream scenara_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 3080;
        listen [::]:3080;
        server_name _;

        location /api/v1/media/raw/ {
            alias /var/scenara/media/;
            autoindex off;
            gzip off;
            sendfile on;
            tcp_nopush on;

            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;

            types {
                image/png  png;
                image/jpeg jpg jpeg;
                image/webp webp;
                image/gif  gif;
                video/mp4  mp4;
                video/webm webm;
                audio/mpeg mp3;
                audio/wav  wav;
                audio/ogg  ogg;
            }
        }

        location /api/media-proxy {
            proxy_pass http://scenara_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/comfyui-proxy/ {
            proxy_pass http://scenara_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        location /api/ {
            proxy_pass http://scenara_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            add_header X-Accel-Buffering no;
            proxy_connect_timeout 60s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
        }

        location / {
            proxy_pass http://scenara_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
